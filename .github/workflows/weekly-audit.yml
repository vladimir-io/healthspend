name: Weekly Full Coverage Audit Pipeline

on:
  schedule:
    # Run every Sunday at 1:00 AM UTC
    - cron: '0 1 * * 0'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  HS_FULL_CPT_COVERAGE: '1'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.states.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - id: states
        run: echo "states=$(jq -c '.' .github/audit-states.json)" >> "$GITHUB_OUTPUT"

  audit_states:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        state: ${{ fromJson(needs.setup.outputs.states) }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch discovery inputs
        run: python3 scripts/fetch_discovery_inputs.py

      - name: Build scraper
        run: |
          cd scraper
          cargo build --release > /tmp/scraper-build.log 2>&1
          tail -100 /tmp/scraper-build.log
          cd ..

      - name: Run discovery for ${{ matrix.state }}
        continue-on-error: true
        run: |
          cd scraper
          cargo run --release --bin scraper -- --discover-only --state ${{ matrix.state }}
          cd ..

      - name: Enrich hospital URLs for ${{ matrix.state }}
        continue-on-error: true
        run: |
          python3 scripts/enrich_hospital_urls.py \
            --compliance-db scraper/compliance.db \
            --state ${{ matrix.state }} \
            --limit 600 \
            --workers 24

      - name: Run audit for ${{ matrix.state }}
        continue-on-error: true
        run: |
          cd scraper
          cargo run --release --bin scraper -- --audit-only --state ${{ matrix.state }}
          cd ..

      - name: Ingest MRF prices for ${{ matrix.state }}
        continue-on-error: true
        env:
          HS_FULL_CPT_COVERAGE: '1'
        run: |
          mkdir -p /tmp/mrf-${{ matrix.state }}
          python3 scripts/mrf_streamer.py \
            --prices-db scraper/prices.db \
            --compliance-db scraper/compliance.db \
            --mrf-dir /tmp/mrf-${{ matrix.state }} \
            --state ${{ matrix.state }} \
            --limit 350 \
            --cleanup

      - name: Validate output
        continue-on-error: true
        run: |
          python3 scripts/validate_database.py scraper/prices.db || true
          python3 scripts/validate_database.py scraper/compliance.db || true

      - name: Upload intermediate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-logs-${{ matrix.state }}
          path: scraper/target/debug/logs
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload compliance DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-db-${{ matrix.state }}
          path: scraper/compliance.db
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload prices DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prices-db-${{ matrix.state }}
          path: scraper/prices.db
          retention-days: 3
          if-no-files-found: ignore

  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [setup, audit_states]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Real-format MRF parser regression
        run: bash scripts/ci_real_mrf_regression.sh

      - name: Download and merge compliance DBs from matrix jobs
        continue-on-error: true
        run: |
          mkdir -p /tmp/compliance_shards
          for state in $(echo '${{ needs.setup.outputs.states }}' | jq -r '.[]'); do
            gh run download ${{ github.run_id }} --name "compliance-db-${state}" --dir "/tmp/compliance_shards/${state}" 2>/dev/null || true
          done
          python3 scripts/merge_compliance_shards.py --shards-dir /tmp/compliance_shards --out scraper/compliance.db
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download and merge prices DBs from matrix jobs
        continue-on-error: true
        run: |
          mkdir -p /tmp/prices_shards
          for state in $(echo '${{ needs.setup.outputs.states }}' | jq -r '.[]'); do
            gh run download ${{ github.run_id }} --name "prices-db-${state}" --dir "/tmp/prices_shards/${state}" 2>/dev/null || true
          done
          python3 scripts/merge_prices_shards.py --shards-dir /tmp/prices_shards --out scraper/prices.db
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Baseline Database
        run: |
          mkdir -p web/public
          wget -q -O web/public/audit_data.db https://huggingface.co/datasets/vladimir-io/healthspend-data/resolve/main/audit_data.db || echo "Baseline not found; proceeding with fresh database."

      - name: Run compliance ingestion (UPSERT)
        run: python3 ingest.py

      - name: Merge Pipeline Data
        run: |
          if [ ! -f scraper/prices.db ]; then
            echo "No merged scraper/prices.db — prices merge may have been skipped"
          fi
          python3 scripts/merge_pipeline_data.py

      - name: Build hot database shard
        run: python3 scripts/build_hot_db.py --source web/public/audit_data.db --out web/public/audit_hot.db

      - name: Verify dataset artifacts
        run: python3 scripts/verify_dataset_artifacts.py

      - name: Write dataset manifest
        run: python3 scripts/write_dataset_manifest.py

      - name: Validate final database
        continue-on-error: true
        run: python3 scripts/validate_database.py web/public/audit_data.db || true

      - name: Compute metrics
        continue-on-error: true
        run: python3 scripts/compute_metrics.py 2>&1 || echo "Metrics computation failed"

      - name: Generate weekly data manifest
        run: |
          python3 - << 'PY'
          import json
          from datetime import datetime, timezone

          manifest = {
              "version": "1.0",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "build_id": "${{ github.run_id }}",
              "pipeline": "github_actions_weekly_full",
              "full_cpt_coverage": True,
              "success": True,
          }

          with open("web/public/data_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY

      - name: Upload final database
        uses: actions/upload-artifact@v4
        with:
          name: weekly-full-database
          path: web/public/audit_data.db
          retention-days: 30

      - name: Deploy to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            pip install huggingface_hub
            python3 scripts/deploy_huggingface.py --repo-id vladimir-io/healthspend-data --files web/public/audit_data.db web/public/audit_hot.db web/public/dataset_manifest.json
          else
            echo "Skipping Hugging Face deployment because HF_TOKEN secret is not set."
          fi

      - name: Notify success
        if: success()
        run: |
          echo "✓ Weekly full coverage pipeline completed successfully"
          echo "Run ID: ${{ github.run_id }}"
          echo "Timestamp: $(date -Iseconds)"

      - name: Notify failure
        if: failure()
        run: |
          echo "✗ Weekly full coverage pipeline had errors"
          echo "Run ID: ${{ github.run_id }}"
          exit 1
