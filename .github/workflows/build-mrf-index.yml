name: Build MRF URL Index

on:
  schedule:
    # Weekly — index changes slowly; reuse artifact for daily ingests
    - cron: '0 6 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/health_system_roots.txt'
      - 'scripts/build_mrf_index.py'
      - 'scripts/cms_hpt_utils.py'
      - '.github/workflows/build-mrf-index.yml'

jobs:
  build_index:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Fetch CMS inputs
        run: python3 scripts/fetch_discovery_inputs.py

      - name: Build national MRF URL index
        run: python3 scripts/build_mrf_index.py --workers 32 --out data/mrf_url_index.sqlite

      - name: Index stats
        run: |
          sqlite3 data/mrf_url_index.sqlite \
            "SELECT COUNT(DISTINCT ccn) AS hospitals, COUNT(*) AS mrf_rows FROM mrf_urls;"

      - uses: actions/upload-artifact@v4
        with:
          name: mrf-url-index
          path: data/mrf_url_index.sqlite
          retention-days: 14
