name: Daily Hospital Audit Pipeline

on:
  schedule:
    # Run at 2 AM UTC daily (10 PM ET, 9 PM CT, 8 PM MT, 7 PM PT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      state:
        description: 'Filter to specific state (optional, format: TX)'
        required: false
        default: ''
      full_cpt_coverage:
        description: 'Enable full CPT ingestion (larger data volume)'
        required: false
        default: 'false'
  push:
    branches:
      - main
    paths:
      - 'scraper/src/**'
      - 'scripts/**'
      - '.github/workflows/daily-audit.yml'
      - '.github/audit-states.json'
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  HS_FULL_CPT_COVERAGE: '1'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.states.outputs.states }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch discovery inputs (once per workflow)
        run: python3 scripts/fetch_discovery_inputs.py

      - uses: actions/upload-artifact@v4
        with:
          name: discovery-inputs
          path: |
            data/discovery
            hospitals.csv
          retention-days: 2

      - id: states
        run: |
          if [ -n "${{ github.event.inputs.state }}" ]; then
            echo 'states=["${{ github.event.inputs.state }}"]' >> "$GITHUB_OUTPUT"
          else
            echo "states=$(jq -c '.' .github/audit-states.json)" >> "$GITHUB_OUTPUT"
          fi

  audit_states:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        state: ${{ fromJson(needs.setup.outputs.states) }}
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: scraper/target
          key: ${{ runner.os }}-scraper-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: discovery-inputs

      - name: Build scraper
        run: |
          cd scraper
          cargo build --release
          cd ..

      - name: Run discovery for ${{ matrix.state }}
        continue-on-error: true
        run: |
          cd scraper
          cargo run --release --bin scraper -- --discover-only --state ${{ matrix.state }}
          cd ..

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mrf-url-index
          path: data

      - name: Apply MRF URL index for ${{ matrix.state }}
        continue-on-error: true
        run: |
          if [ -f data/mrf_url_index.sqlite ]; then
            python3 scripts/apply_mrf_index.py \
              --index data/mrf_url_index.sqlite \
              --state ${{ matrix.state }}
          else
            echo "No mrf-url-index artifact — run 'Build MRF URL Index' workflow first"
          fi

      - name: Enrich hospital URLs for ${{ matrix.state }}
        timeout-minutes: 45
        continue-on-error: true
        run: |
          python3 scripts/enrich_hospital_urls.py \
            --compliance-db scraper/compliance.db \
            --state ${{ matrix.state }} \
            --limit 500 \
            --workers 12
          sqlite3 scraper/compliance.db \
            "SELECT COUNT(*) AS with_hpt FROM hospitals WHERE COALESCE(cms_hpt_url,'') != '' AND UPPER(state)=UPPER('${{ matrix.state }}');" \
            "SELECT COUNT(*) AS with_mrf FROM hospitals WHERE COALESCE(mrf_url,'') != '' AND UPPER(state)=UPPER('${{ matrix.state }}');"

      - name: Run audit for ${{ matrix.state }}
        continue-on-error: true
        run: |
          cd scraper
          cargo run --release --bin scraper -- --audit-only --state ${{ matrix.state }}
          cd ..

      - name: Ingest MRF prices for ${{ matrix.state }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/mrf-${{ matrix.state }}
          python3 scripts/mrf_streamer.py \
            --prices-db scraper/prices.db \
            --compliance-db scraper/compliance.db \
            --mrf-dir /tmp/mrf-${{ matrix.state }} \
            --state ${{ matrix.state }} \
            --limit 120 \
            --cleanup

      - name: Validate output
        continue-on-error: true
        run: |
          python3 scripts/validate_database.py scraper/prices.db || true
          python3 scripts/validate_database.py scraper/compliance.db || true

      - name: Upload intermediate artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs-${{ matrix.state }}
          path: scraper/target/debug/logs
          retention-days: 7
          if-no-files-found: ignore

      - name: Pack and upload state shard
        if: always()
        run: |
          mkdir -p "shard-pkg/${{ matrix.state }}"
          cp scraper/compliance.db scraper/prices.db "shard-pkg/${{ matrix.state }}/" 2>/dev/null || true
          sqlite3 "shard-pkg/${{ matrix.state }}/prices.db" "SELECT COUNT(*) AS prices FROM prices;" 2>/dev/null || echo "prices=0"

      - name: Upload state shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-shard-${{ matrix.state }}
          path: shard-pkg/${{ matrix.state }}
          retention-days: 2
          if-no-files-found: ignore

  # Aggregate job: consolidate results and deploy
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [setup, audit_states]
    if: always()
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run full aggregation
        continue-on-error: true
        run: |
          cd scraper
          cargo run --release --bin scraper -- > /tmp/scraper-aggregate.log 2>&1
          tail -20 /tmp/scraper-aggregate.log
          cd ..

      - name: Download and merge state shards from matrix jobs
        continue-on-error: true
        run: |
          mkdir -p /tmp/audit_shards
          for state in $(echo '${{ needs.setup.outputs.states }}' | jq -r '.[]'); do
            gh run download ${{ github.run_id }} --name "audit-shard-${state}" --dir "/tmp/audit_shards/${state}" 2>/dev/null || true
          done
          python3 scripts/merge_compliance_shards.py --shards-dir /tmp/audit_shards --out scraper/compliance.db
          python3 scripts/merge_prices_shards.py --shards-dir /tmp/audit_shards --out scraper/prices.db
          echo "Merged shard summary:"
          sqlite3 scraper/prices.db "SELECT COUNT(*) AS prices, COUNT(DISTINCT cpt_code) AS cpts FROM prices;" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch Baseline Database
        run: |
          mkdir -p web/public
          wget -q -O web/public/audit_data.db https://huggingface.co/datasets/vladimir-io/healthspend-data/resolve/main/audit_data.db || echo "Baseline not found; proceeding with fresh database."

      - name: Run compliance ingestion
        run: python3 ingest.py

      - name: Validate final database
        continue-on-error: true
        run: python3 scripts/validate_database.py web/public/audit_data.db || true

      - name: Merge Pipeline Data
        run: |
          if [ ! -f scraper/prices.db ]; then
            echo "No merged scraper/prices.db — prices merge may have been skipped"
          fi
          python3 scripts/merge_pipeline_data.py

      - name: Build hot database shard
        run: python3 scripts/build_hot_db.py --source web/public/audit_data.db --out web/public/audit_hot.db

      - name: Verify dataset artifacts
        id: verify
        run: python3 scripts/verify_dataset_artifacts.py

      - name: Write dataset manifest
        run: python3 scripts/write_dataset_manifest.py

      - name: Compute metrics
        continue-on-error: true
        run: python3 scripts/compute_metrics.py 2>&1 || echo "Metrics computation failed"

      - name: Generate data manifest
        run: |
          python3 - << 'PY'
          import json
          from datetime import datetime, timezone

          manifest = {
              "version": "1.0",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "build_id": "${{ github.run_id }}",
              "pipeline": "github_actions",
              "success": True,
          }

          with open("web/public/data_manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False)
          PY

      - name: Check for parse errors
        continue-on-error: true
        run: |
          sqlite3 scraper/compliance.db "SELECT COUNT(*) as error_count FROM parse_errors WHERE resolved = 0;" || echo "Parse errors table not found"

      - name: Upload final database
        uses: actions/upload-artifact@v4
        with:
          name: final-database
          path: web/public/audit_data.db
          retention-days: 30

      - name: Deploy to Hugging Face
        if: success() && steps.verify.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            pip install huggingface_hub
            python3 scripts/deploy_huggingface.py --repo-id vladimir-io/healthspend-data --files web/public/audit_data.db web/public/audit_hot.db web/public/dataset_manifest.json
          else
            echo "HF_TOKEN not set, skipping deploy"
          fi

      - name: Notify success
        if: success()
        run: |
          echo "✓ Pipeline completed successfully"
          echo "Run ID: ${{ github.run_id }}"
          echo "Timestamp: $(date -Iseconds)"

      - name: Notify failure
        if: failure()
        run: |
          echo "✗ Pipeline had errors"
          echo "Run ID: ${{ github.run_id }}"
          exit 1

  # Status badge job
  update-badge:
    runs-on: ubuntu-latest
    needs: aggregate
    if: always()
    permissions:
      contents: write
      
    steps:
      - name: Set status
        run: |
          if [ "${{ needs.aggregate.result }}" == "success" ]; then
            echo "BADGE_STATUS=passing" >> $GITHUB_ENV
            echo "BADGE_COLOR=green" >> $GITHUB_ENV
          else
            echo "BADGE_STATUS=failing" >> $GITHUB_ENV
            echo "BADGE_COLOR=red" >> $GITHUB_ENV
          fi

      - name: Log pipeline status
        run: |
          echo "Pipeline Status: ${{ env.BADGE_STATUS }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Timestamp: $(date -Iseconds)"
